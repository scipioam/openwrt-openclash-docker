services:
  openwrt:
    image: "local-openwrt:${OPENWRT_VERSION}-oc${OPENCLASH_VERSION}"
    pull_policy: never

    container_name: openwrt
    hostname: openwrt

    restart: unless-stopped
    privileged: true
    stop_grace_period: 20s

    command:
      - /root/init-openwrt.sh

    environment:
      OWRT_IP: "${OPENWRT_IP}"
      OWRT_NETMASK: "255.255.255.0"
      OWRT_GATEWAY: "${OPENWRT_GATEWAY}"
      OWRT_DNS: "${OPENWRT_GATEWAY}"

    volumes:
      - ./init-openwrt.sh:/root/init-openwrt.sh:ro
      - ./backups/bootstrap:/bootstrap:ro
      - openwrt_config:/etc/config
      - openclash_data:/etc/openclash

    devices:
      - /dev/net/tun:/dev/net/tun

    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"

    networks:
      openwrt_lan:
        ipv4_address: "${OPENWRT_IP}"

networks:
  openwrt_lan:
    name: openwrt_macnet
    driver: macvlan

    driver_opts:
      parent: enp1s0
      macvlan_mode: bridge

    ipam:
      config:
        - subnet: 192.168.0.0/24
          ip_range: 192.168.0.248/29
          gateway: 192.168.0.1
          aux_addresses:
            host-shim: "${OPENWRT_HOST_SHIM_IP}"

volumes:
  openwrt_config:
    name: openwrt_config

  openclash_data:
    name: openclash_data
